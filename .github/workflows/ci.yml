name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: npx tsc --noEmit
      - name: Registry is up to date
        run: |
          pnpm registry:build
          git diff --exit-code -- public/r registry.json || {
            echo "::error::Run pnpm registry:build and commit the result."
            exit 1
          }
      - run: pnpm build
